// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.0'

    repositories {
        google()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Desktop OpenJDK port (linux-port/): jars the app's javac output instead of
// dexing it. Applied only under -PlinuxPort, so a normal Android build never
// configures any of it.
if (hasProperty('linuxPort')) {
    apply from: "$rootDir/linux-port/gradle/jar-for-linux-port.gradle"
}
